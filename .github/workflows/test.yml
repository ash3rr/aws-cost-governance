name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m py_compile audit/*.py guardrails/config-compliance-to-slack/src/*/*.py
      - run: pytest -q
      - run: cfn-lint templates/*.yaml guardrails/config-compliance-to-slack/template.yaml
